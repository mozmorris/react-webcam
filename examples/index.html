<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>React Webcam</title>
  <style>
    body {
      font-family: "Helvetica Neue", Helvetica, sans-serif;
      font-weight: 200;
      margin: 0 auto 50px;
      width: 750px;
    }
    textarea {
      font-family: monospace;
      font-size: inherit;
      height: 150px;
      width: 100%;
    }
    pre {
      white-space: pre-wrap;
    }
    .controls {
      margin: 10px 0;
    }
    .webcams > video:nth-of-type(1) {
      -webkit-filter: grayscale(1);
      filter: grayscale(1);
    }
    .webcams > video:nth-of-type(2) {
      -webkit-filter: sepia(1);
      filter: sepia(1);
    }
    .webcams > video:nth-of-type(3) {
      -webkit-filter: saturate(8);
      filter: saturate(8);
    }
    .webcams > video:nth-of-type(4) {
      -webkit-filter: hue-rotate(90deg);
      filter: hue-rotate(90deg);
    }
    .webcams > video:nth-of-type(6) {
      -webkit-filter: invert(1);
      filter: invert(1);
    }
    .webcams > video:nth-of-type(7) {
      -webkit-filter: brightness(3);
      filter: brightness(3);
    }
    .webcams > video:nth-of-type(8) {
      -webkit-filter: contrast(4);
      filter: contrast(4);
    }
    .webcams > video:nth-of-type(9) {
      -webkit-filter: blur(1px);
      filter: blur(1px);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
  <script src="../dist/react-webcam.js"></script>
  <script type="text/babel">
    // getUserMedia only works for secure pages

    function App() {
      const [screenshot, setScreenshot] = React.useState(null);
      const webcamRef = React.useRef(null);

      const handleClick = () => {
        const screenshotData = webcamRef.current.getScreenshot();
        setScreenshot(screenshotData);
      };

      return (
        <div>
          <h1>react-webcam</h1>
          <Webcam
            ref={webcamRef}
          />
          <div>
            <h2>CSS Filters & style prop</h2>
            <div className='webcams'>
              <Webcam
                width='212'
                height='160'
              />
              <Webcam
                width='212'
                height='160'
                style={{ transform: 'rotate(180deg)' }}
              />
              <Webcam
                width='212'
                height='160'
              />
              <Webcam
                width='212'
                height='160'
                style={{ transform: 'rotate(180deg)' }}
              />
              <Webcam
                width='212'
                height='160'
              />
              <Webcam
                width='212'
                height='160'
                style={{ transform: 'rotate(180deg)' }}
              />
              <Webcam
                width='212'
                height='160'
              />
              <Webcam
                width='212'
                height='160'
                style={{ transform: 'rotate(180deg)' }}/>
              <Webcam
                width='212'
                height='160'
              />
            </div>
          </div>
          <div>
            <h2>Screenshot (via ref)</h2>
            <div className='screenshots'>
              <div className='controls'>
                <button onClick={handleClick}>capture</button>
              </div>
              {screenshot ? <img src={screenshot} /> : null}
            </div>
          </div>
          <div>
            <h2>Screenshot (via render props)</h2>
            <div className='screenshots'>
              <Webcam>
                {({ getScreenshot }) => (
                  <button
                    onClick={() => {
                      const screenshotData = getScreenshot();
                      setScreenshot(screenshotData);
                    }}
                  >
                    Capture photo
                  </button>
                )}
              </Webcam>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
